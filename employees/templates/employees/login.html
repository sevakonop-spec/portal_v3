<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Corporate Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a2236 0%, #0f172a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 2.5rem 2.25rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .login-logo {
      font-size: 1.5rem; font-weight: 800; color: #0066cc;
      margin-bottom: 1.75rem; text-align: center; letter-spacing: .02em;
    }
    .login-logo span { color: #1e293b; }
    .form-floating label { font-size: .9rem; }
    .btn-signin {
      background: #0066cc; border: none; font-weight: 600;
      padding: .7rem; font-size: .95rem; letter-spacing: .03em;
    }
    .btn-signin:hover { background: #0052a3; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo"><i class="bi bi-building text-primary"></i> Corp<span>Portal</span></div>
  <p class="text-center text-secondary mb-4" style="font-size:.88rem;">Sign in to your corporate account</p>

  {% if messages %}
    {% for message in messages %}
    <div class="alert alert-danger py-2" style="font-size:.875rem;">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" autocomplete="off">
    {% csrf_token %}
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="username" name="username"
             placeholder="Username" required autofocus>
      <label for="username"><i class="bi bi-person"></i> Username</label>
    </div>
    <div class="form-floating mb-4">
      <input type="password" class="form-control" id="password" name="password"
             placeholder="Password" required>
      <label for="password"><i class="bi bi-lock"></i> Password</label>
    </div>
    <button type="submit" class="btn btn-primary btn-signin w-100">
      Sign In <i class="bi bi-arrow-right-short"></i>
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
